name: Umoja Afya Release Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - run: python scripts/validate_release.py
      - run: pytest -q
      - name: Validate database migration
        env:
          DATABASE_URL: sqlite:///./ci_migration.db
          UMOJA_ENVIRONMENT: production
          UMOJA_SECURITY_SECRET: ci-only-secret
          UMOJA_ENFORCE_AUTH: "true"
          UMOJA_DEMO_CREDENTIALS: "false"
        run: alembic upgrade head
