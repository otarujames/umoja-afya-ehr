encounter_flow:
  initial_states: [PRE_REGISTERED, ARRIVED, WAITING_REGISTRATION]
  transitions:
    PRE_REGISTERED: [ARRIVED, REGISTERED]
    ARRIVED: [WAITING_REGISTRATION, REGISTERED, WAITING_TRIAGE, LEFT_WITHOUT_BEING_SEEN]
    WAITING_REGISTRATION: [REGISTERED, LEFT_WITHOUT_BEING_SEEN]
    REGISTERED: [WAITING_TRIAGE, TRANSFERRED]
    WAITING_TRIAGE: [TRIAGED, LEFT_WITHOUT_BEING_SEEN]
    TRIAGED: [READY_FOR_PROVIDER, TRANSFERRED]
    READY_FOR_PROVIDER: [ROOMED, LEFT_WITHOUT_BEING_SEEN]
    ROOMED: [IN_PROGRESS]
    IN_PROGRESS: [WAITING_RESULTS, READY_FOR_DISCHARGE, TRANSFERRED]
    WAITING_RESULTS: [IN_PROGRESS, READY_FOR_DISCHARGE, TRANSFERRED]
    READY_FOR_DISCHARGE: [DISCHARGED, IN_PROGRESS]
    DISCHARGED: []
    TRANSFERRED: []
    LEFT_WITHOUT_BEING_SEEN: []

flowsheet_flow:
  transitions:
    DRAFT: [START]
    RUNNING: [PAUSE, CHANGE, STOP]
    PAUSED: [RESUME, CHANGE, STOP]
    STOPPED: []
  action_results:
    START: RUNNING
    PAUSE: PAUSED
    RESUME: RUNNING
    CHANGE: unchanged
    STOP: STOPPED
