product: Umoja Afya Enterprise EHR
release: 11.0.0
implementation_model: one national longitudinal record with configurable facility modules
modules:
- code: PATIENT_REGISTRATION
  name: Identity, Registration and Consent
  capability_group: Patient Access
  status: functional
  description: National MPI search-before-create, duplicate review, demographics, NIDA-ready verification,
    consent, proxy, coverage, pre-registration, emergency, unknown-patient and newborn workflows.
  routes:
  - /registration
  - /patient-search
  api:
  - /registration/search
  - /registration
  - /patients
  integrations:
  - NIDA
  - NHIF/UHI
  - HFR
  - consent_service
- code: SCHEDULING_REFERRALS
  name: Scheduling, Queues and Referrals
  capability_group: Patient Access
  status: functional
  description: Appointment creation, confirmation, arrival, cancellation, specialist referral intake,
    acceptance, scheduling and closure.
  routes:
  - /scheduling
  api:
  - /appointments
  - /referrals
  integrations:
  - workflow_notification_service
  - SMS/USSD
  - provider_directory
- code: ADT_PATIENT_FLOW
  name: ADT, Bed and Patient Flow
  capability_group: Operations
  status: functional
  description: Arrival, triage progression, admission, transfer, discharge, bed assignment, occupancy,
    EVS states, capacity and recent-discharge management.
  routes:
  - /patient-flow
  - /bed-board
  - /recent-discharges
  api:
  - /tracker
  - /encounters
  - /beds
  - /recent-discharges
  integrations:
  - registration
  - emergency
  - billing
  - infection_control
- code: AMBULATORY_CARE
  name: Ambulatory and Outpatient Care
  capability_group: Clinical Care
  status: functional_core
  description: Longitudinal chart, encounter documentation, orders, results, medication management, follow-up
    and care-team follow-up.
  routes:
  - /chart
  - /clinical-documentation
  api:
  - /patients
  - /notes
  - /orders
  - /results
  - /work-items
  integrations:
  - CPOE
  - pharmacy
  - lab
  - imaging
  - workflow_notification_service
- code: EMERGENCY
  name: Emergency and Triage
  capability_group: Clinical Care
  status: functional_workqueue
  description: Emergency tracking, acuity, trauma activation, resuscitation, observation, disposition
    and downstream specialty coordination.
  routes:
  - /emergency
  - /patient-flow
  api:
  - /tracker
  - /module-activities
  integrations:
  - ADT
  - lab
  - radiology
  - blood_bank
  - theatre
- code: CLINICAL_DOCUMENTATION
  name: Inpatient Clinical Documentation
  capability_group: Clinical Care
  status: functional
  description: History and physical, progress notes, consults, procedure notes, care plans, discharge
    summaries, signature and cosign workflows.
  routes:
  - /clinical-documentation
  - /chart
  api:
  - /notes
  - /patients
  integrations:
  - orders
  - results
  - pharmacy
  - flowsheets
- code: NURSING_EMAR
  name: Nursing and eMAR
  capability_group: Clinical Care
  status: functional
  description: Patient lists, time-controlled flowsheets, observations, medication administration, held/refused
    documentation and audit history.
  routes:
  - /nursing
  - /flowsheets
  api:
  - /flowsheets
  - /medications
  integrations:
  - devices
  - pharmacy
  - early_warning
- code: ORDERS_RESULTS
  name: CPOE and Results
  capability_group: Clinical Care
  status: functional
  description: Laboratory, imaging, medication, blood, procedure and referral orders with result review
    and critical acknowledgement.
  routes:
  - /orders
  - /results
  api:
  - /orders
  - /results
  integrations:
  - LIS
  - RIS/PACS
  - pharmacy
  - CDS
- code: PHARMACY
  name: Pharmacy and Medication Management
  capability_group: Ancillary
  status: functional
  description: Medication orders, pharmacist verification, eMAR readiness, administration history, formulary-facing
    workflow and inventory linkage.
  routes:
  - /pharmacy
  - /nursing
  api:
  - /medications
  - /inventory
  integrations:
  - eLMIS/MSD
  - billing
  - orders
- code: LABORATORY
  name: Laboratory Information System
  capability_group: Ancillary
  status: functional_workqueue
  description: Electronic specimen worklists, priority, ownership, status progression, results and national
    surveillance linkage.
  routes:
  - /laboratory
  api:
  - /module-activities
  - /orders
  - /results
  integrations:
  - HL7v2
  - analyzers
  - eIDSR
  - DHIS2
- code: BLOOD_BANK
  name: Blood Bank and Transfusion
  capability_group: Ancillary
  status: functional_workqueue
  description: Type and screen, crossmatch, issue readiness, transfusion coordination and traceability
    activities.
  routes:
  - /blood-bank
  api:
  - /module-activities
  - /orders
  integrations:
  - lab
  - theatre
  - emergency
- code: RADIOLOGY
  name: Radiology and PACS
  capability_group: Ancillary
  status: functional_workqueue
