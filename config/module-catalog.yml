  routes:
  - /radiology
  api:
  - /module-activities
  - /orders
  - /results
  integrations:
  - DICOM
  - PACS
- code: THEATRE
  name: Theatre and Procedures
  capability_group: Perioperative
  status: functional_workqueue
  description: Case readiness, scheduling, supplies, implants, intra-operative activity and recovery coordination.
  routes:
  - /theatre
  api:
  - /module-activities
  - /inventory
  - /charges
  integrations:
  - blood_bank
  - pharmacy
  - sterilization
  - billing
- code: ANESTHESIA
  name: Anesthesia
  capability_group: Perioperative
  status: functional_workqueue
  description: Pre-anesthesia review, intra-operative monitoring workflow, medication coordination and
