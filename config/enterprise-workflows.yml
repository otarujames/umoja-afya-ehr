closed_loop_rules:
  referral_closure_requires_return_summary: true
  critical_result_requires_acknowledgement: true
  medication_given_requires_pharmacy_verification: true
  bed_discharge_routes_to_evs: true
  signed_note_requires_addendum_for_change: true
  claim_submission_creates_interface_event: true
  public_health_event_creates_national_outbox_event: true
workflows:
  telehealth_session:
    states:
    - SCHEDULED
    - READY
    - IN_PROGRESS
    - PAUSED
    - COMPLETED
    - CANCELLED
    transitions:
      SCHEDULED:
      - START
      - CANCEL
      READY:
      - START
      - CANCEL
      IN_PROGRESS:
      - PAUSE
      - COMPLETE
      - CANCEL
      PAUSED:
      - RESUME
      - COMPLETE
      - CANCEL
      COMPLETED: []
      CANCELLED: []
    closed_loop:
    - appointment_created
    - patient_notified
    - readiness_task
    - session_audit
    - documentation_and_orders
    - follow_up
