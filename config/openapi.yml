openapi: 3.1.0
info:
  title: Umoja Afya Enterprise EHR
  description: Umoja Afya Tanzania enterprise electronic health record. Includes national
    MPI and patient registration, scheduling/referrals, ADT and unit management, longitudinal
    documentation, orders/results, flowsheets/eMAR, pharmacy, revenue cycle, supply
    chain, quality, public health, remote care, FHIR and audit. Patient-facing portal
    delivery is intentionally deferred from this release.
  version: 11.0.0
