release: 11.0.0
identity:
  password_hash: Argon2id
  unique_user_accounts: required
  mfa_privileged_roles: required_in_production
  session_timeout_minutes: 20
  failed_login_lockout:
    attempts: 5
    lock_minutes: 15
  emergency_access:
    enabled: true
    reason_required: true
    default_minutes: 30
access:
  authorization_model: per-user function x department x facility matrix
  patient_context_required_for_clinical_actions: true
  default_deny_in_production: true
  access_review_frequency_days: 90
application:
  maximum_request_bytes: 26214400
  login_rate_limit_per_minute: 10
  api_rate_limit_per_minute: 240
  security_headers: [CSP, HSTS-production, X-Content-Type-Options, X-Frame-Options, Referrer-Policy, Permissions-Policy]
  api_cache_control: no-store
offline:
  enabled_by_policy: true
  secure_context_https_required: true
  local_encryption: AES-256-GCM
  pin_key_derivation: PBKDF2-SHA-256-310000
  default_access_lease_hours: 24
  maximum_access_lease_hours: 72
  server_credentials_stored_on_device: false
  bearer_token_stored_on_device: false
  idempotent_replay_receipts: required
  online_only_high_risk_actions: true
  managed_device_screen_lock_and_full_disk_encryption: required
network:
  tls_minimum: TLS-1.2
  database_publicly_exposed: false
  production_database_network: internal
logging:
  audit_mutations: true
  audit_access_changes: true
  audit_break_glass: true
  log_phi_in_application_logs: prohibited
  audit_offline_device_enrollment_and_sync: true
operations:
  database_migrations: alembic
  backup_encryption: required_in_production
  restore_test_frequency_days: 90
  penetration_test: required_before_live_patient_use
