name: umoja-afya-ehr
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-umoja_afya}
      POSTGRES_USER: ${POSTGRES_USER:-umoja}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: ${TZ:-Africa/Dar_es_Salaam}
    secrets: [postgres_password]
    volumes:
      - umoja_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-umoja} -d ${POSTGRES_DB:-umoja_afya}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [ehr_private]
    stop_grace_period: 90s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "10"}

  transcription:
    build:
      context: ./services/transcription
      dockerfile: Dockerfile
    image: ${UMOJA_TRANSCRIPTION_IMAGE:-umoja-afya-transcription:11.0.0}
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${UMOJA_WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${UMOJA_WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${UMOJA_WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_CPU_THREADS: ${UMOJA_WHISPER_CPU_THREADS:-6}
      WHISPER_NUM_WORKERS: ${UMOJA_WHISPER_NUM_WORKERS:-1}
      WHISPER_BEAM_SIZE: ${UMOJA_WHISPER_BEAM_SIZE:-5}
      WHISPER_BEST_OF: ${UMOJA_WHISPER_BEST_OF:-5}
      WHISPER_MODEL_CACHE: /models
      HF_HOME: /models
      XDG_CACHE_HOME: /models
      HF_HUB_DISABLE_XET: "1"
      WHISPER_MAX_AUDIO_BYTES: ${UMOJA_TRANSCRIPTION_MAX_AUDIO_BYTES:-52428800}
      WHISPER_EAGER_LOAD: ${UMOJA_WHISPER_EAGER_LOAD:-true}
      TZ: ${TZ:-Africa/Dar_es_Salaam}
    volumes:
      - umoja_whisper_models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks: [ehr_private, model_egress]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    pids_limit: 512
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RELEASE_VERSION: 11.0.0
    image: ${UMOJA_IMAGE:-umoja-afya-ehr:11.0.0}
    restart: unless-stopped
    init: true
    command: ["/bin/bash", "-c", "exec uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --workers 4 --proxy-headers --forwarded-allow-ips='*' --timeout-keep-alive 5 --timeout-graceful-shutdown 45 --limit-concurrency 2000 --backlog 4096 --no-server-header"]
    environment:
      UMOJA_DB_HOST: db
      UMOJA_DB_PORT: "5432"
      UMOJA_DB_NAME: ${POSTGRES_DB:-umoja_afya}
      UMOJA_DB_USER: ${POSTGRES_USER:-umoja}
      UMOJA_DB_PASSWORD_FILE: /run/secrets/postgres_password
      UMOJA_DB_SSLMODE: disable
      UMOJA_TRANSCRIPTION_ENDPOINT: http://transcription:8090/transcribe
      UMOJA_TRANSCRIPTION_REQUIRED: ${UMOJA_TRANSCRIPTION_REQUIRED:-true}
      UMOJA_TRANSCRIPTION_TIMEOUT_SECONDS: ${UMOJA_TRANSCRIPTION_TIMEOUT_SECONDS:-300}
      UMOJA_MAX_REQUEST_BYTES: ${UMOJA_MAX_REQUEST_BYTES:-62914560}
      UMOJA_TRANSCRIPTION_MAX_AUDIO_BYTES: ${UMOJA_TRANSCRIPTION_MAX_AUDIO_BYTES:-52428800}
      UMOJA_TRANSCRIPTION_MIN_CONFIDENCE: ${UMOJA_TRANSCRIPTION_MIN_CONFIDENCE:-0.55}
      UMOJA_RETAIN_RAW_CLINICAL_AUDIO: "false"
      UMOJA_ENVIRONMENT: production
      UMOJA_SCHEMA_AUTO_CREATE: "false"
      UMOJA_SEED_DEMO_DATA: "false"
      UMOJA_ENFORCE_AUTH: "true"
      UMOJA_ENFORCE_RBAC: "true"
      UMOJA_DEMO_CREDENTIALS: "false"
      UMOJA_API_DOCS_ENABLED: ${UMOJA_API_DOCS_ENABLED:-false}
      UMOJA_CORS_ORIGINS: ${UMOJA_CORS_ORIGINS:?Set UMOJA_CORS_ORIGINS in .env}
      UMOJA_ALLOWED_HOSTS: ${UMOJA_ALLOWED_HOSTS:?Set UMOJA_ALLOWED_HOSTS in .env}
      UMOJA_SECURITY_SECRET_FILE: /run/secrets/security_secret
      UMOJA_PRELOADED_USERS_FILE: /run/secrets/preloaded_users
      UMOJA_DB_POOL_SIZE: ${UMOJA_DB_POOL_SIZE:-15}
      UMOJA_DB_MAX_OVERFLOW: ${UMOJA_DB_MAX_OVERFLOW:-30}
      UMOJA_RATE_LIMIT_PER_MINUTE: ${UMOJA_RATE_LIMIT_PER_MINUTE:-1200}
      UMOJA_LOGIN_RATE_LIMIT_PER_MINUTE: ${UMOJA_LOGIN_RATE_LIMIT_PER_MINUTE:-20}
      UMOJA_OFFLINE_ACCESS_ENABLED: ${UMOJA_OFFLINE_ACCESS_ENABLED:-true}
      UMOJA_OFFLINE_LEASE_HOURS: ${UMOJA_OFFLINE_LEASE_HOURS:-24}
      UMOJA_OFFLINE_MAX_PENDING: ${UMOJA_OFFLINE_MAX_PENDING:-1000}
      UMOJA_CASH_DRAWER_ID: ${UMOJA_CASH_DRAWER_ID:-MAIN-CASH-DRAWER}
      UMOJA_CARD_TERMINAL_ID: ${UMOJA_CARD_TERMINAL_ID:-}
      UMOJA_MOBILE_MONEY_TILL: ${UMOJA_MOBILE_MONEY_TILL:-}
      UMOJA_BANK_ACCOUNT: ${UMOJA_BANK_ACCOUNT:-}
      UMOJA_PAYMENT_GATEWAY_ACCOUNT: ${UMOJA_PAYMENT_GATEWAY_ACCOUNT:-}
      UMOJA_CRYPTO_WALLET: ${UMOJA_CRYPTO_WALLET:-}
      UMOJA_CRYPTO_NETWORK: ${UMOJA_CRYPTO_NETWORK:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      TZ: ${TZ:-Africa/Dar_es_Salaam}
    secrets: [postgres_password, security_secret, preloaded_users]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 150s
    networks: [ehr_private, ehr_public]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    pids_limit: 1024
    stop_grace_period: 90s
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "10"}

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${UMOJA_HTTP_BIND:-0.0.0.0}:8080:80"
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes:
      - ./deploy/nginx/umoja-afya.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    depends_on:
      app:
        condition: service_started
    networks: [ehr_public]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE", "CHOWN", "SETGID", "SETUID"]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=16m
      - /tmp:size=32m
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "10"}

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  security_secret:
    file: ./secrets/security_secret
  preloaded_users:
    file: ./secrets/preloaded_users.json

volumes:
  umoja_pgdata:
  umoja_whisper_models:

networks:
  ehr_private:
    internal: true
  ehr_public:
  model_egress:
