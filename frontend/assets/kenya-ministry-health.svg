<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <!-- Title -->
  <text x="200" y="30" font-size="28" font-weight="bold" text-anchor="middle" font-family="Arial">REPUBLIC OF KENYA</text>
  
  <!-- Shield -->
  <path d="M 200 60 L 150 100 L 150 250 Q 150 320 200 380 Q 250 320 250 250 L 250 100 Z" fill="none" stroke="black" stroke-width="3"/>
  
  <!-- Shield sections -->
  <rect x="150" y="100" width="100" height="50" fill="black"/>
  <rect x="150" y="150" width="100" height="50" fill="red"/>
  <rect x="150" y="200" width="100" height="50" fill="green"/>
  
  <!-- White rooster in center -->
  <circle cx="200" cy="175" r="15" fill="white"/>
  
  <!-- Left lion -->
  <circle cx="120" cy="150" r="25" fill="gold"/>
  <polygon points="120,120 125,135 115,135" fill="gold"/>
  
  <!-- Right lion -->
  <circle cx="280" cy="150" r="25" fill="gold"/>
  <polygon points="280,120 285,135 275,135" fill="gold"/>
  
  <!-- Banner -->
  <rect x="140" y="360" width="120" height="40" fill="red" stroke="black" stroke-width="2"/>
  <text x="200" y="388" font-size="18" font-weight="bold" text-anchor="middle" font-family="Arial" fill="white">HARAMBEE</text>
  
  <!-- Ministry text -->
  <text x="200" y="460" font-size="24" font-weight="bold" text-anchor="middle" font-family="Arial" fill="#0099FF">MINISTRY OF HEALTH</text>
</svg>